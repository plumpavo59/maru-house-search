services:
  - type: web
    name: maru-house-search
    runtime: node
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: RU_EMAIL
        sync: false
      - key: MARA_EMAIL
        sync: false
